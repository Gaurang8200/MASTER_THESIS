# Gesture selection system configuration.
# Every path is resolved relative to the pipeline folder unless the value is
# already absolute.
# This file contains only values read by the multimodal speech gesture service.

model:
  # Gesture detection weights downloaded from Ultralytics HUB.
  weights: ../models/handgestureyolov8m960100.pt
  # auto resolves to cuda, then mps, then cpu.
  device: auto
  imgsz: 960
  half: false
  max_detections: 20
  # Frames slower than this budget are reported as degraded in the output.
  latency_budget_ms: 120.0

# Object detector of the existing pick and drop repository.
# It reports bounding boxes and no segmentation masks.
object_model:
  # Folder that holds the YOLOv5 source, the one with hubconf.py.
  repo_path: "../../../UR_Audio_Steuerung_Using_LLM/Code-YOLOv5-Windows_llm/yolov5"
  weights: "../../../UR_Audio_Steuerung_Using_LLM/Code-YOLOv5-Windows_llm/yolov5/my_model.pt"
  imgsz: 640
  # Overlap needed to keep an object id from one frame to the next. Without a
  # stable id the selection hold could never complete.
  track_min_iou: 0.5

# Mapping from gesture name to the class index used during training.
# Every checkpoint class must be listed so model validation can succeed.
class_ids:
  open_palm_start: 0
  pointing_finger: 1
  index_fingertip: 2

confidence:
  # The pointing gesture must have a strong score.
  gesture: 0.70
  # The fingertip box is small, so it is allowed a lower score.
  fingertip: 0.65
  # Objects below this score never take part in selection.
  object: 0.70

selection:
  # The fingertip selects the smallest object box it sits inside.
  # Set a ratio between 0 and 1 to also require the fingertip to be that close to
  # the box center, measured in half box widths. Leave empty to accept the box.
  max_center_distance_ratio:

camera:
  index: 0
  width: 1280
  height: 720
  # Mirror the preview so that moving the hand right moves the overlay right.
  flip_horizontal: false
